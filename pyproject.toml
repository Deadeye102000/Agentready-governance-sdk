[tool.poetry]
name = "agentready-governance-sdk"
version = "0.1.0"
description = "Python SDK for AgentReady Governance API"
authors = ["AgentReady <support@agentready.ai>"]
readme = "README.md"
packages = [{include = "agentready_governance_sdk"}]

[tool.poetry.dependencies]
python = ">=3.12"
httpx = ">=0.27"
pydantic = ">=2.0"
tenacity = ">=8.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
respx = ">=0.22"
ruff = "*"
black = "*"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
